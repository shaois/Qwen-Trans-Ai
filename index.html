<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 翻譯與寫作專家 | NVIDIA NIM</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #3b82f6; --border: #334155; --success: #22c55e; --error: #ef4444; --input-bg: #0b1120; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    .container { width: 100%; max-width: 900px; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .api-banner { background: #f59e0b22; border: 1px solid #f59e0b; color: #fbbf24; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 1rem; cursor: pointer; }
    .api-banner:hover { background: #f59e0b33; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; align-items: center; }
    select, button, textarea { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.95rem; }
    select { flex: 1; min-width: 120px; }
    button { background: var(--accent); border: none; cursor: pointer; font-weight: 500; transition: 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .editor { grid-template-columns: 1fr; } }
    textarea { width: 100%; min-height: 250px; resize: vertical; background: var(--input-bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.5; }
    .actions { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
    .status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.5rem; }
    .status.loading { color: var(--accent); }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    .modal { display: none; position: fixed; inset: 0; background: #000000aa; align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 2rem; border-radius: 12px; width: 90%; max-width: 450px; }
    .modal-content input { width: 100%; margin: 1rem 0; }
    .footer { margin-top: 2rem; font-size: 0.8rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌐 AI 翻譯與寫作專家</h1>
      <p>基於 NVIDIA NIM 大型語言模型｜支援翻譯 & 專家級文稿潤飾</p>
    </header>

    <div class="api-banner" id="apiBanner">🔑 尚未設定 NVIDIA API Key｜點擊此處輸入</div>

    <div class="controls">
      <select id="sourceLang">
        <option value="auto">自動偵測</option>
        <option value="English">英文</option>
        <option value="Traditional Chinese">繁體中文</option>
        <option value="Japanese">日文</option>
        <option value="Korean">韓文</option>
        <option value="French">法文</option>
        <option value="German">德文</option>
        <option value="Spanish">西班牙文</option>
      </select>
      <span>➜</span>
      <select id="targetLang">
        <option value="Traditional Chinese">繁體中文</option>
        <option value="English">英文</option>
        <option value="Japanese">日文</option>
        <option value="Korean">韓文</option>
        <option value="French">法文</option>
        <option value="German">德文</option>
        <option value="Spanish">西班牙文</option>
      </select>
      <select id="mode">
        <option value="translate">🔄 翻譯模式</option>
        <option value="polish">✨ 專家寫作/潤飾模式</option>
      </select>
      <select id="tone">
        <option value="neutral">中性/預設</option>
        <option value="formal">正式/商務</option>
        <option value="academic">學術/嚴謹</option>
        <option value="creative">創意/行銷</option>
        <option value="concise">簡潔/精煉</option>
      </select>
    </div>

    <div class="editor">
      <textarea id="inputText" placeholder="在此貼上或輸入原始文稿..."></textarea>
      <textarea id="outputText" placeholder="產出結果將顯示於此..." readonly></textarea>
    </div>

    <div class="actions">
      <button id="btnRun">⚡ 執行</button>
      <button id="btnCopy" disabled>📋 複製結果</button>
      <button id="btnClear">🗑️ 清空</button>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">
      此為純前端靜態頁面，API Key 僅儲存於您的瀏覽器 Session 中，不會上傳至任何伺服器。<br>
      建議僅供個人或團隊內部使用。生產環境請搭配後端 Proxy 保護金鑰。
    </div>
  </div>

  <!-- API Key Modal -->
  <div class="modal" id="apiModal">
    <div class="modal-content">
      <h2>🔐 輸入 NVIDIA API Key</h2>
      <p style="font-size:0.9rem; color:#94a3b8; margin:0.5rem 0;">請至 <a href="https://build.nvidia.com" target="_blank" style="color:#60a5fa;">build.nvidia.com</a> 註冊並取得金鑰。</p>
      <input type="password" id="apiKeyInput" placeholder="nvapi-xxxxxxxxxxxxxxxx">
      <div style="display:flex; gap:0.5rem;">
        <button id="saveKey" style="flex:1;">儲存並關閉</button>
        <button id="closeModal" style="flex:1; background:#475569;">取消</button>
      </div>
    </div>
  </div>

  <script>
    // --- 狀態與元素 ---
    const els = {
      apiBanner: document.getElementById('apiBanner'),
      modal: document.getElementById('apiModal'),
      keyInput: document.getElementById('apiKeyInput'),
      saveKey: document.getElementById('saveKey'),
      closeModal: document.getElementById('closeModal'),
      source: document.getElementById('sourceLang'),
      target: document.getElementById('targetLang'),
      mode: document.getElementById('mode'),
      tone: document.getElementById('tone'),
      input: document.getElementById('inputText'),
      output: document.getElementById('outputText'),
      run: document.getElementById('btnRun'),
      copy: document.getElementById('btnCopy'),
      clear: document.getElementById('btnClear'),
      status: document.getElementById('status')
    };

    let apiKey = sessionStorage.getItem('nvidia_api_key') || '';
    if (apiKey) els.apiBanner.textContent = '✅ API Key 已設定';
    els.apiBanner.onclick = () => els.modal.classList.add('active');

    // --- Modal 控制 ---
    els.closeModal.onclick = () => els.modal.classList.remove('active');
    els.saveKey.onclick = () => {
      const val = els.keyInput.value.trim();
      if (!val.startsWith('nvapi-')) return alert('金鑰格式應以 nvapi- 開頭');
      apiKey = val;
      sessionStorage.setItem('nvidia_api_key', val);
      els.apiBanner.textContent = '✅ API Key 已設定';
      els.modal.classList.remove('active');
    };

    // --- 核心邏輯 ---
    els.run.onclick = async () => {
      if (!apiKey) return alert('請先設定 NVIDIA API Key');
      const text = els.input.value.trim();
      if (!text) return alert('請輸入文字');

      els.run.disabled = true;
      els.output.value = '';
      els.status.className = 'status loading';
      els.status.textContent = ' 正在呼叫 NVIDIA NIM 模型...';

      const isTranslate = els.mode.value === 'translate';
      const tone = els.tone.value;
      const src = els.source.value === 'auto' ? 'auto-detected' : els.source.value;
      const tgt = els.target.value;

      const systemPrompt = isTranslate
        ? `You are a professional translator. Translate the user's text from ${src} to ${tgt}. Preserve original meaning, tone, and formatting. Output ONLY the translated text.`
        : `You are an expert writing editor. Refine and polish the following ${tgt} text for clarity, flow, and professionalism. Apply tone: ${tone}. Maintain original intent. Output ONLY the revised text.`;

      try {
        // ✅ 使用 corsproxy.io 繞過 CORS 限制
        const proxy = "https://corsproxy.io/?"; 
        const apiUrl = "https://integrate.api.nvidia.com/v1/chat/completions";
        
        const res = await fetch(proxy + encodeURIComponent(apiUrl), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'meta/llama-3.1-70b-instruct',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: text }
            ],
            temperature: isTranslate ? 0.2 : 0.4,
            max_tokens: 4096,
            top_p: 0.9
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const result = data.choices[0].message.content.trim();
        els.output.value = result;
        els.copy.disabled = false;
        els.status.className = 'status success';
        els.status.textContent = '✅ 完成';
      } catch (e) {
        console.error(e);
        els.status.className = 'status error';
        els.status.textContent = `❌ 錯誤: ${e.message}`;
      } finally {
        els.run.disabled = false;
      }
    };

    els.copy.onclick = () => {
      navigator.clipboard.writeText(els.output.value);
      els.status.className = 'status success';
      els.status.textContent = '📋 已複製到剪貼簿';
    };

    els.clear.onclick = () => {
      els.input.value = '';
      els.output.value = '';
      els.status.textContent = '';
      els.copy.disabled = true;
    };
  </script>
</body>
</html>
