<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 翻譯與寫作專家 | Groq LPU</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8;
    --bg:#f2f4f8; --border:#d7dbe0; --text:#202124; --muted:#5f6368;
    --green-bg:#d9f2e3; --green-border:#1e8e5a;
    --red-bg:#fdecea; --red-border:#d93025; --red-text:#c5221f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:1160px;margin:0 auto;padding:20px 24px 40px;}
  .tabs{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:12px;padding:6px;gap:4px;margin-bottom:18px;}
  .tab{border:0;background:transparent;padding:10px 22px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--blue);color:#fff;font-weight:600;}
  .banner{border-radius:10px;padding:14px 18px;text-align:center;font-size:15px;margin-bottom:18px;border:1px solid transparent;}
  .banner.key-ok{background:var(--green-bg);border-color:var(--green-border);color:#08503c;cursor:pointer;}
  .banner.key-missing{background:#fff3cd;border-color:#e0a800;color:#7a5c00;cursor:pointer;}
  .banner.error{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text);text-align:left;margin-top:22px;}
  .lang-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  select{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:15px;min-width:220px;}
  .swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:18px;}
  .swap:disabled{opacity:.4;cursor:not-allowed;}
  .model-badge{margin-left:auto;background:#e8eaed;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-family:Consolas,monospace;font-size:13px;}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .pane{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .pane-head{display:flex;justify-content:space-between;align-items:center;background:#f1f3f4;border-bottom:1px solid var(--border);padding:10px 14px;font-weight:600;}
  .pane-head .count{font-weight:400;color:var(--muted);font-size:13px;}
  .pane-head button{border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted);}
  textarea{border:0;outline:none;resize:vertical;min-height:280px;padding:14px;font-size:16px;line-height:1.6;font-family:inherit;background:#fafbfc;}
  .actions{display:flex;gap:14px;margin-top:22px;}
  .btn{border-radius:8px;padding:12px 26px;font-size:15px;cursor:pointer;border:1px solid var(--border);background:#fff;}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
  .btn.primary:disabled{opacity:.6;cursor:not-allowed;}
  footer{border-top:1px solid var(--border);margin-top:36px;padding-top:18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal[hidden]{display:none;}
  .modal-box{background:#fff;border-radius:12px;padding:26px 28px;width:min(440px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-box h3{margin:0 0 8px;}
  .modal-box p{margin:0 0 14px;color:var(--muted);font-size:14px;}
  .modal-box input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  @media(max-width:800px){.panes{grid-template-columns:1fr}.model-badge{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">

  <div class="tabs">
    <button class="tab active" data-mode="translate">🌐 翻譯</button>
    <button class="tab" data-mode="write">✍️ 專家寫作</button>
    <button class="tab" data-mode="polish">✨ 文稿潤飾</button>
  </div>

  <div id="keyBanner" class="banner key-missing">🔑 尚未設定 Groq API Key｜點擊此處輸入</div>

  <!-- 翻譯面板 -->
  <section id="panel-translate">
    <div class="lang-row">
      <select id="srcLang">
        <option value="auto">自動偵測</option>
        <option value="English">英文</option>
        <option value="Traditional Chinese">繁體中文</option>
        <option value="Japanese">日文</option>
        <option value="Korean">韓文</option>
        <option value="French">法文</option>
        <option value="German">德文</option>
        <option value="Spanish">西班牙文</option>
      </select>
      <button class="swap" id="swapBtn" title="交換語言">⇄</button>
      <select id="dstLang">
        <option value="Traditional Chinese" selected>繁體中文</option>
        <option value="English">英文</option>
        <option value="Japanese">日文</option>
        <option value="Korean">韓文</option>
        <option value="French">法文</option>
        <option value="German">德文</option>
        <option value="Spanish">西班牙文</option>
      </select>
      <span class="model-badge" id="modelBadge">qwen/qwen3.8-27b</span>
    </div>
    <div class="panes">
      <div class="pane">
        <div class="pane-head"><span>原文</span><span class="count" id="charCount">0 字</span></div>
        <textarea id="srcText" placeholder="請輸入要翻譯的文字..."></textarea>
      </div>
      <div class="pane">
        <div class="pane-head"><span>譯文</span><button id="copyBtn">複製</button></div>
        <textarea id="dstText" readonly placeholder="翻譯結果將顯示於此..."></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="translateBtn">⚡ 翻譯</button>
      <button class="btn" id="clearBtn">🗑️ 清除</button>
    </div>
  </section>

  <!-- 專家寫作面板 -->
  <section id="panel-write" hidden>
    <div class="panes">
      <div class="pane">
        <div class="pane-head"><span>寫作需求</span></div>
        <textarea id="writeInput" placeholder="請描述寫作主題、風格、篇幅與需求..."></textarea>
      </div>
      <div class="pane">
        <div class="pane-head"><span>成品</span><button id="copyWriteBtn">複製</button></div>
        <textarea id="writeOutput" readonly placeholder="寫作結果將顯示於此..."></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="writeBtn">⚡ 產生</button>
      <button class="btn" id="writeClearBtn">🗑️ 清除</button>
    </div>
  </section>

  <!-- 文稿潤飾面板 -->
  <section id="panel-polish" hidden>
    <div class="panes">
      <div class="pane">
        <div class="pane-head"><span>原文</span></div>
        <textarea id="polishInput" placeholder="請貼上需要潤飾的文稿..."></textarea>
      </div>
      <div class="pane">
        <div class="pane-head"><span>潤飾結果</span><button id="copyPolishBtn">複製</button></div>
        <textarea id="polishOutput" readonly placeholder="潤飾結果將顯示於此..."></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="polishBtn">⚡ 潤飾</button>
      <button class="btn" id="polishClearBtn">🗑️ 清除</button>
    </div>
  </section>

  <div id="errorBanner" class="banner error" hidden></div>

  <footer>
    使用 Groq API 免費服務｜每分鐘限流約 30 次請求<br>
    API Key 僅儲存於瀏覽器 Session，關閉分頁自動清除
  </footer>
</div>

<!-- API Key 彈窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3>輸入 Groq API Key</h3>
    <p>請至 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> 建立金鑰</p>
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off" />
    <div class="modal-actions">
      <button class="btn primary" id="saveKeyBtn">儲存</button>
      <button class="btn" id="cancelKeyBtn">取消</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   ✅ 修正重點：Groq 已不提供 qwen-3.6-27b，
   改為目前支援的 qwen/qwen3.8-27b
   ===================================================== */
const MODEL   = "qwen/qwen3.8-27b";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const KEY_SLOT = "groq_api_key";

const $ = id => document.getElementById(id);
const keyBanner = $("keyBanner"), modal = $("modal"), keyInput = $("keyInput");
const errorBanner = $("errorBanner");
const srcLang = $("srcLang"), dstLang = $("dstLang"), swapBtn = $("swapBtn");
const srcText = $("srcText"), dstText = $("dstText"), charCount = $("charCount");

$("modelBadge").textContent = MODEL;

/* ---------- API Key 管理（Session 儲存） ---------- */
const getKey = () => sessionStorage.getItem(KEY_SLOT) || "";
function refreshKeyBanner(){
  if (getKey()){
    keyBanner.className = "banner key-ok";
    keyBanner.textContent = "🔑 ✅ Groq API Key 已設定（點擊可更換）";
  } else {
    keyBanner.className = "banner key-missing";
    keyBanner.textContent = "🔑 尚未設定 Groq API Key｜點擊此處輸入";
  }
}
keyBanner.onclick = () => { keyInput.value = getKey(); modal.hidden = false; keyInput.focus(); };
$("cancelKeyBtn").onclick = () => modal.hidden = true;
$("saveKeyBtn").onclick = () => {
  const v = keyInput.value.trim();
  if (v) sessionStorage.setItem(KEY_SLOT, v); else sessionStorage.removeItem(KEY_SLOT);
  modal.hidden = true; refreshKeyBanner();
};
refreshKeyBanner();

/* ---------- 分頁切換 ---------- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    ["translate","write","polish"].forEach(m => {
      $("panel-" + m).hidden = (m !== tab.dataset.mode);
    });
    hideError();
  };
});

/* ---------- 小工具 ---------- */
function showError(msg){ errorBanner.textContent = "❌ " + msg; errorBanner.hidden = false; }
function hideError(){ errorBanner.hidden = true; }
srcText.addEventListener("input", () => {
  charCount.textContent = srcText.value.replace(/\s/g,"").length + " 字";
});
swapBtn.onclick = () => { const s = srcLang.value; srcLang.value = dstLang.value; dstLang.value = s; syncSwap(); };
function syncSwap(){ swapBtn.disabled = (srcLang.value === "auto"); }
srcLang.onchange = syncSwap; syncSwap();

function bindCopy(btnId, taId){
  $(btnId).onclick = async () => {
    const ta = $(taId); if (!ta.value) return;
    try { await navigator.clipboard.writeText(ta.value); } catch(e){ ta.select(); document.execCommand("copy"); }
  };
}
bindCopy("copyBtn","dstText"); bindCopy("copyWriteBtn","writeOutput"); bindCopy("copyPolishBtn","polishOutput");

/* ---------- Groq API 呼叫 ---------- */
async function callGroq(messages){
  const key = getKey();
  if (!key){ modal.hidden = false; keyInput.focus(); throw new Error("尚未設定 Groq API Key"); }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + key,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: MODEL,          // ✅ qwen/qwen3.8-27b
      messages: messages,
      temperature: 0.3
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
    throw new Error(msg);
  }
  return data.choices[0].message.content;
}

async function run(btn, outTa, messages, placeholder){
  hideError();
  btn.disabled = true;
  outTa.value = ""; outTa.placeholder = placeholder || "處理中...";
  try {
    outTa.value = await callGroq(messages);
    outTa.placeholder = placeholder;
  } catch(e){
    showError("錯誤: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 翻譯 ---------- */
$("translateBtn").onclick = () => {
  const text = srcText.value.trim();
  if (!text) return;
  const s = srcLang.value === "auto" ? "the auto-detected source language" : srcLang.value;
  const d = dstLang.value;
  run($("translateBtn"), dstText, [
    { role: "system", content: "You are a professional translator. Translate the user's text from " + s + " to " + d + ". Output only the translated text, without explanations or notes." },
    { role: "user", content: text }
  ], "翻譯結果將顯示於此...");
};
$("clearBtn").onclick = () => { srcText.value = ""; dstText.value = ""; charCount.textContent = "0 字"; hideError(); };

/* ---------- 專家寫作 ---------- */
$("writeBtn").onclick = () => {
  const text = $("writeInput").value.trim();
  if (!text) return;
  run($("writeBtn"), $("writeOutput"), [
    { role: "system", content: "You are an expert professional writer. Follow the user's requirements and produce high-quality, well-structured content. Output only the finished content." },
    { role: "user", content: text }
  ], "寫作結果將顯示於此...");
};
$("writeClearBtn").onclick = () => { $("writeInput").value = ""; $("writeOutput").value = ""; hideError(); };

/* ---------- 文稿潤飾 ---------- */
$("polishBtn").onclick = () => {
  const text = $("polishInput").value.trim();
  if (!text) return;
  run($("polishBtn"), $("polishOutput"), [
    { role: "system", content: "You are a professional editor. Polish and refine the user's text: improve fluency, clarity and tone while preserving the original meaning and language. Output only the polished text." },
    { role: "user", content: text }
  ], "潤飾結果將顯示於此...");
};
$("polishClearBtn").onclick = () => { $("polishInput").value = ""; $("polishOutput").value = ""; hideError(); };
</script>
</body>
</html>
